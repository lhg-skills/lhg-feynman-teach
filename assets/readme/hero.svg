<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">费曼教学 — 把知识点用费曼法讲通，再做成教学视频</title>
  <desc id="desc">输入一个想讲给观众的主题，先用费曼四步讲通，再输出学习结论与讲稿即旁白的教学视频。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="14" fill="#FEFCE8"/>
  <rect x="1" y="1" width="1198" height="358" rx="14" fill="none" stroke="#FDE68A" stroke-width="1.5"/>

  <g id="title-block">
    <rect x="64" y="62" width="12" height="12" fill="#DC2626"/>
    <text class="mono" x="86" y="74" font-size="17" letter-spacing="2" fill="#78716C">费曼教学 · SKILL</text>
    <text class="sans" x="64" y="152" font-size="72" font-weight="700" fill="#292524">费曼教学</text>
    <text class="sans" x="64" y="196" font-size="26" font-weight="700" fill="#854D0E">讲通，再做成教学视频</text>
    <text class="sans" x="64" y="238" font-size="21" fill="#292524">费曼四步讲通，讲稿即旁白，默认 3 分钟。</text>
  </g>

  <line x1="700" y1="56" x2="700" y2="256" stroke="#FDE68A" stroke-width="1.5"/>

  <g id="proof">
    <text class="sans" x="740" y="74" font-size="17" fill="#78716C">教学视频的三个数</text>
    <text class="mono" x="740" y="118" font-size="20" font-weight="700" fill="#DC2626">费曼四步</text>
    <text class="sans" x="834" y="118" font-size="22" font-weight="700" fill="#292524">讲 → 简化重讲</text>
    <text class="mono" x="740" y="164" font-size="20" font-weight="700" fill="#DC2626">3 分钟</text>
    <text class="sans" x="811" y="164" font-size="22" font-weight="700" fill="#292524">默认教学视频</text>
    <text class="mono" x="740" y="210" font-size="20" font-weight="700" fill="#DC2626">2 种画面</text>
    <text class="sans" x="831" y="210" font-size="22" font-weight="700" fill="#292524">幻灯片 / 手绘</text>
  </g>

  <line x1="64" y1="288" x2="1136" y2="288" stroke="#FDE68A" stroke-width="1.5"/>
  <g id="install">
    <text class="mono" x="64" y="327" font-size="16" fill="#78716C">安装</text>
    <text class="mono" x="140" y="327" font-size="20" font-weight="700" fill="#854D0E">npx skills add lhg-skills/lhg-feynman-teach</text>
  </g>
</svg>
